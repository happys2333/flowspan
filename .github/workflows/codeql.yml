name: CodeQL

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  schedule:
    - cron: "21 3 * * 2"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: csharp
          build-mode: manual

      - name: Restore locked dependencies
        run: dotnet restore Flowspan.slnx --locked-mode

      - name: Build analyzed source
        run: dotnet build Flowspan.slnx --configuration Release --no-restore

      - name: Build standalone probe source for analysis
        run: |
          dotnet build tools/Flowspan.MacOS.CaptureProbe/Flowspan.MacOS.CaptureProbe.csproj --configuration Release
          dotnet build tools/Flowspan.MacOS.NativeCaptureProbe/Flowspan.MacOS.NativeCaptureProbe.csproj --configuration Release
          dotnet build tools/Flowspan.Windows.CaptureProbe/Flowspan.Windows.CaptureProbe.csproj --configuration Release
          dotnet build tools/Flowspan.Linux.CaptureProbe/Flowspan.Linux.CaptureProbe.csproj --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0

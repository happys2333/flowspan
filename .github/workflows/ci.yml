name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore Flowspan.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Flowspan.slnx --verify-no-changes --no-restore

      - name: Build with warnings as errors
        run: dotnet build Flowspan.slnx --configuration Release --no-restore

      - name: Run tests
        run: >-
          dotnet test Flowspan.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFilePrefix=${{ runner.os }}"
          --results-directory TestResults
          --blame-hang
          --blame-hang-timeout 3m
          --blame-hang-dump-type none

      - name: Validate desktop composition in explicit test mode
        run: >-
          dotnet run
          --project src/Flowspan.Desktop/Flowspan.Desktop.csproj
          --configuration Release
          --no-build
          --no-restore
          --
          --validate-composition

      - name: Run deterministic simulator
        run: >-
          dotnet run
          --project src/Flowspan.Simulator/Flowspan.Simulator.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Build standalone capture ABI probe
        run: >-
          dotnet build
          tools/Flowspan.MacOS.CaptureProbe/Flowspan.MacOS.CaptureProbe.csproj
          --configuration Release

      - name: Run capture ABI probe without screen capture
        run: >-
          dotnet run
          --project tools/Flowspan.MacOS.CaptureProbe/Flowspan.MacOS.CaptureProbe.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Build standalone production-driver capture probe
        run: >-
          dotnet build
          tools/Flowspan.MacOS.NativeCaptureProbe/Flowspan.MacOS.NativeCaptureProbe.csproj
          --configuration Release

      - name: Verify production-driver probe formatting
        run: >-
          dotnet format
          tools/Flowspan.MacOS.NativeCaptureProbe/Flowspan.MacOS.NativeCaptureProbe.csproj
          --verify-no-changes
          --no-restore

      - name: Verify production-driver probe defaults to no capture
        run: >-
          dotnet run
          --project tools/Flowspan.MacOS.NativeCaptureProbe/Flowspan.MacOS.NativeCaptureProbe.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Build standalone Windows D3D11 readback probe
        run: >-
          dotnet build
          tools/Flowspan.Windows.CaptureProbe/Flowspan.Windows.CaptureProbe.csproj
          --configuration Release

      - name: Build standalone macOS delegate ownership probe
        run: >-
          dotnet build
          tools/Flowspan.MacOS.DelegateProbe/Flowspan.MacOS.DelegateProbe.csproj
          --configuration Release
          -p:RestoreLockedMode=true

      - name: Verify delegate probe formatting
        run: >-
          dotnet format
          tools/Flowspan.MacOS.DelegateProbe/Flowspan.MacOS.DelegateProbe.csproj
          --verify-no-changes
          --no-restore

      - name: Require no-native delegate probe default
        shell: bash
        run: |
          set -euo pipefail
          result="$(dotnet tools/Flowspan.MacOS.DelegateProbe/bin/Release/net10.0/Flowspan.MacOS.DelegateProbe.dll)"
          result="${result//$'\r'/}"
          printf '%s\n' "$result"
          test "$result" = 'delegate_probe=skip; reason=explicit_run_required; native_calls=0; capture_executed=false'

      - name: Require actual synthetic macOS delegate ABI without capture
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/MacOSDelegateEvidence"
          mkdir -p "$evidence"
          dotnet tools/Flowspan.MacOS.DelegateProbe/bin/Release/net10.0/Flowspan.MacOS.DelegateProbe.dll --run-synthetic > "$evidence/native.stdout.raw" 2> "$evidence/native.stderr.raw"
          test ! -s "$evidence/native.stderr.raw"
          test "$(wc -c < "$evidence/native.stdout.raw")" -le 4096
          test "$(wc -l < "$evidence/native.stdout.raw")" -eq 1
          test "$(LC_ALL=C tr -d '\000' < "$evidence/native.stdout.raw" | wc -c)" -eq "$(wc -c < "$evidence/native.stdout.raw")"
          result="$(< "$evidence/native.stdout.raw")"
          printf '%s\n' "$result"
          pattern='^delegate_probe=pass; mode=synthetic; method_signatures=3; native_callbacks=[1-9][0-9]*; managed_invocations_exited=true; published_bridges=([1-9]|1[0-6]); published_bridges_retained=true; capture_executed=false; SCStream_creations=0; AppKit_initialized=false; permissions_requested=0; pixel_reads=0$'
          [[ "$result" =~ $pattern ]]

      - name: Upload synthetic delegate evidence even on failure
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: macos-delegate-synthetic-${{ github.sha }}
          path: ${{ runner.temp }}/MacOSDelegateEvidence
          if-no-files-found: warn
          retention-days: 14

      - name: Require actual Foundation association lifetime without capture
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/MacOSAssociationEvidence"
          mkdir -p "$evidence"
          dotnet tools/Flowspan.MacOS.DelegateProbe/bin/Release/net10.0/Flowspan.MacOS.DelegateProbe.dll --run-associations > "$evidence/native.stdout.raw" 2> "$evidence/native.stderr.raw"
          test ! -s "$evidence/native.stderr.raw"
          test "$(wc -c < "$evidence/native.stdout.raw")" -le 4096
          test "$(wc -l < "$evidence/native.stdout.raw")" -eq 1
          test "$(LC_ALL=C tr -d '\000' < "$evidence/native.stdout.raw" | wc -c)" -eq "$(wc -c < "$evidence/native.stdout.raw")"
          result="$(< "$evidence/native.stdout.raw")"
          printf '%s\n' "$result"
          expected='association_probe=pass; mode=foundation; permanent_bridges=1; process_routers=1; probe_gc_handles=0; method_signatures=4; tag_budget=16; maximum_tags_in_use=16; tags_allocated=86; tag_owners_released=86; tag_dealloc_entries=86; tag_super_deallocations=86; tags_in_use=0; quarantined_tags=0; source_owners_acquired=87; source_owners_released=87; native_callbacks=249; unknown_callbacks=2; callback_source_retains=249; callback_source_releases=249; callback_tag_retains=247; callback_tag_releases=247; healthy_generations=64; forced_gc_rounds=12; contained_failures=0; capture_executed=false; SCStream_creations=0; AppKit_initialized=false; permissions_requested=0; pixel_reads=0; early_publication_proved=false'
          test "$result" = "$expected"

      - name: Upload Foundation association evidence even on failure
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: macos-association-foundation-${{ github.sha }}
          path: ${{ runner.temp }}/MacOSAssociationEvidence
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Windows probe formatting
        run: >-
          dotnet format
          tools/Flowspan.Windows.CaptureProbe/Flowspan.Windows.CaptureProbe.csproj
          --verify-no-changes
          --no-restore

      - name: Run portable Windows readback self-tests
        run: >-
          dotnet run
          --project tools/Flowspan.Windows.CaptureProbe/Flowspan.Windows.CaptureProbe.csproj
          --configuration Release
          --no-build
          --no-restore
          --
          --self-test

      - name: Run portable Windows WGC-boundary self-tests without capture
        run: >-
          dotnet run
          --project tools/Flowspan.Windows.CaptureProbe/Flowspan.Windows.CaptureProbe.csproj
          --configuration Release
          --no-build
          --no-restore
          --
          --wgc-self-test

      - name: Run Windows WARP readback probe without window capture
        run: >-
          dotnet run
          --project tools/Flowspan.Windows.CaptureProbe/Flowspan.Windows.CaptureProbe.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Build standalone Linux thread-loop ABI probe
        run: >-
          dotnet build
          tools/Flowspan.Linux.CaptureProbe/Flowspan.Linux.CaptureProbe.csproj
          --configuration Release

      - name: Verify Linux probe formatting
        run: >-
          dotnet format
          tools/Flowspan.Linux.CaptureProbe/Flowspan.Linux.CaptureProbe.csproj
          --verify-no-changes
          --no-restore

      - name: Run portable Linux thread-loop self-tests
        run: >-
          dotnet run
          --project tools/Flowspan.Linux.CaptureProbe/Flowspan.Linux.CaptureProbe.csproj
          --configuration Release
          --no-build
          --no-restore
          --
          --self-test

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  linux-thread-loop-abi:
    name: Linux thread-loop ABI (no capture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Install PipeWire library without a daemon or portal
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libpipewire-0.3-0t64

      - name: Record actual native runtime and runner image
        shell: bash
        run: |
          mkdir -p NativeProbeEvidence
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' libpipewire-0.3-0t64 \
            | tee NativeProbeEvidence/package.txt
          uname -a | tee NativeProbeEvidence/kernel.txt
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion" \
            | tee NativeProbeEvidence/image.txt
          dotnet --info | tee NativeProbeEvidence/dotnet.txt

      - name: Build standalone Linux thread-loop ABI probe
        run: >-
          dotnet build
          tools/Flowspan.Linux.CaptureProbe/Flowspan.Linux.CaptureProbe.csproj
          --configuration Release

      - name: Verify Linux probe formatting
        run: >-
          dotnet format
          tools/Flowspan.Linux.CaptureProbe/Flowspan.Linux.CaptureProbe.csproj
          --verify-no-changes
          --no-restore

      - name: Run portable self-tests without native calls
        shell: bash
        run: |
          dotnet run \
            --project tools/Flowspan.Linux.CaptureProbe/Flowspan.Linux.CaptureProbe.csproj \
            --configuration Release --no-build --no-restore -- --self-test \
            | tee NativeProbeEvidence/self-test.stdout

      - name: Require actual native thread-loop success and complete cleanup
        shell: bash
        run: |
          dotnet run \
            --project tools/Flowspan.Linux.CaptureProbe/Flowspan.Linux.CaptureProbe.csproj \
            --configuration Release --no-build --no-restore \
            | tee NativeProbeEvidence/native.stdout
          expected='probe=pass mode=thread_loop_abi reason=none library_version=[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)? native_result=0 native_calls_executed=true owners_released=true loop_roundtrip=true lock_roundtrips=2 native_timespec_bytes=16 native_time_valid=true outside_loop_thread=true daemon_connections=0 portal_calls=0 stream_creations=0 hardware_operations=0 window_capture_executed=false permissions_requested=0 pixel_reads=0 pixel_writes=0'
          test "$(wc -l < NativeProbeEvidence/native.stdout)" -eq 1
          grep --extended-regexp --line-regexp "$expected" NativeProbeEvidence/native.stdout

      - name: Upload native ABI evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-thread-loop-abi-evidence
          path: NativeProbeEvidence
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package (${{ matrix.rid }})
    needs: [test, linux-thread-loop-abi]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        shell: bash
        run: dotnet restore Flowspan.slnx --locked-mode

      - name: Build release tooling
        shell: bash
        run: >-
          dotnet build src/Flowspan.Release/Flowspan.Release.csproj
          --configuration Release
          --no-restore

      - name: Verify content-locked build tooling
        shell: bash
        run: >-
          dotnet run --project src/Flowspan.Release/Flowspan.Release.csproj
          --configuration Release --no-build --no-restore --
          verify-build-inputs
          --lock-file src/Flowspan.Release/build-packages.lock.json
          --nuget-packages "$NUGET_PACKAGES"

      - name: Freeze package inputs
        shell: bash
        run: |
          run_number=${{ github.run_number }}
          if [ "$run_number" -gt 99999999 ]; then
            echo "CI run number exceeds the macOS build-version mapping." >&2
            exit 1
          fi
          build_version="$((run_number / 10000)).$(((run_number / 100) % 100)).$((run_number % 100))"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "FLOWSPAN_VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "FLOWSPAN_BUILD_VERSION=$build_version" >> "$GITHUB_ENV"

      - name: Publish self-contained target
        shell: bash
        run: |
          dotnet publish src/Flowspan.Desktop/Flowspan.Desktop.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --no-restore \
            --output artifacts/publish \
            -p:FlowspanDistributionBuild=true \
            -p:Version="$FLOWSPAN_VERSION" \
            -p:InformationalVersion="$FLOWSPAN_VERSION+$GITHUB_SHA"
          if find artifacts/publish -type f -name '*.pdb' | grep -q .; then
            echo "Distribution publish unexpectedly contains PDB files." >&2
            exit 1
          fi
          file_count=$(find artifacts/publish -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$file_count" != 1 ]; then
            echo "Distribution publish must contain exactly one file." >&2
            exit 1
          fi

      - name: Prepare package stage
        shell: bash
        run: |
          dotnet run --project src/Flowspan.Release/Flowspan.Release.csproj \
            --configuration Release --no-build --no-restore -- \
            prepare \
            --publish artifacts/publish \
            --stage artifacts/stage \
            --version "$FLOWSPAN_VERSION" \
            --build-version "$FLOWSPAN_BUILD_VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --rid "${{ matrix.rid }}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --channel ci \
            --minimum-version 0.1.0 \
            --download-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$FLOWSPAN_VERSION/" \
            --builder-id "github-hosted:${{ matrix.os }}" \
            --invocation-id "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"

      - name: Validate packaged composition in explicit test mode
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-x64)
              entry=artifacts/stage/Flowspan/Flowspan.Desktop.exe
              no_runtime=$(cygpath -w "$PWD/artifacts/no-shared-runtime")
              ;;
            osx-arm64) entry=artifacts/stage/Flowspan.app/Contents/MacOS/Flowspan.Desktop ;;
            linux-x64) entry=artifacts/stage/flowspan/Flowspan.Desktop ;;
            *) exit 2 ;;
          esac
          mkdir -p artifacts/no-shared-runtime
          no_runtime=${no_runtime:-"$PWD/artifacts/no-shared-runtime"}
          DOTNET_ROOT="$no_runtime" \
          DOTNET_ROOT_X64="$no_runtime" \
          DOTNET_ROOT_ARM64="$no_runtime" \
          DOTNET_MULTILEVEL_LOOKUP=0 \
            "$entry" --validate-composition

      - name: Seal and verify reproducible unsigned package
        shell: bash
        run: |
          seal() {
            dotnet run --project src/Flowspan.Release/Flowspan.Release.csproj \
              --configuration Release --no-build --no-restore -- \
              seal \
              --stage artifacts/stage \
              --output "$1" \
              --lock-file src/Flowspan.Desktop/packages.lock.json \
              --runtime-lock-file src/Flowspan.Release/runtime-packages.lock.json \
              --nuget-packages "$NUGET_PACKAGES" \
              --signature-state unsigned-test-artifact
          }
          verify() {
            dotnet run --project src/Flowspan.Release/Flowspan.Release.csproj \
              --configuration Release --no-build --no-restore -- \
              verify --output "$1"
          }
          seal artifacts/package-1
          seal artifacts/package-2
          verify artifacts/package-1
          verify artifacts/package-2
          diff --recursive --brief artifacts/package-1 artifacts/package-2

      - name: Audit direct and transitive dependencies
        shell: bash
        run: >-
          dotnet list Flowspan.slnx package
          --vulnerable
          --include-transitive
          --no-restore

      - name: Upload unsigned test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowspan-${{ matrix.rid }}-unsigned-test-${{ github.sha }}
          path: artifacts/package-1
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan committed content
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
